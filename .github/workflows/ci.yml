name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.18 is the first 22.x with default type stripping, which the check
          # scripts (.mjs importing .ts) rely on; npm test disables it explicitly
          # because vitest owns module loading itself
          node-version: '22.18'
          cache: npm
      # --legacy-peer-deps: recharts' optional peer set (react-is) trips some
      # npm arborist versions during peer resolution; the lockfile is exact
      - run: npm ci --legacy-peer-deps
      - run: npx prettier --check src scripts tests
      - run: npm run lint
      - run: node scripts/check-iso.mjs
      - run: node scripts/check-layout.mjs
      - run: npm run check:sim
      - run: npm run check:bus
      - run: npm test
      - run: npm run build
